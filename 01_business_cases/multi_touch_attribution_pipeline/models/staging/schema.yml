version: 2

models:

  - name: stg_google_ads
    description: >
      Cleaned Google Ads daily performance report. One row per campaign/ad group/day.
      cost_micros is converted to spend_usd. Derived metrics (CTR, CPC, CPA) included.
    columns:
      - name: campaign_id
        tests: [not_null]
      - name: date_day
        tests: [not_null]
      - name: channel
        tests:
          - accepted_values:
              values: ['google_ads']
      - name: spend_usd
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: impressions
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: stg_meta_ads
    description: >
      Cleaned Meta Ads daily insights. One row per campaign/adset/day.
      Spend reported in USD. Conversions extracted from the actions JSON array
      (purchase action type only).
    columns:
      - name: campaign_id
        tests: [not_null]
      - name: date_day
        tests: [not_null]
      - name: channel
        tests:
          - accepted_values:
              values: ['meta_ads']
      - name: spend_usd
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

  - name: stg_linkedin_ads
    description: >
      Cleaned LinkedIn Ads daily analytics by campaign. One row per campaign/day.
      cost_in_usd (cents) converted to spend_usd (dollars).
      external_website_conversions used as the conversion metric.
    columns:
      - name: campaign_id
        tests: [not_null]
      - name: date_day
        tests: [not_null]
      - name: channel
        tests:
          - accepted_values:
              values: ['linkedin_ads']
      - name: spend_usd
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

  - name: stg_hubspot_contacts
    description: >
      Cleaned HubSpot contacts with lifecycle stage timestamps, attribution fields,
      and derived conversion flags. Epoch milliseconds converted to timestamps.
    columns:
      - name: contact_id
        tests: [not_null, unique]
      - name: email
        tests: [not_null, unique]
      - name: lifecycle_stage
        tests:
          - accepted_values:
              values:
                - subscriber
                - lead
                - marketingqualifiedlead
                - salesqualifiedlead
                - opportunity
                - customer
                - evangelist
                - other
      - name: is_customer
        tests: [not_null]
