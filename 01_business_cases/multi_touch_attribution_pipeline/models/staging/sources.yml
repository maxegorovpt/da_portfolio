version: 2

sources:

  - name: google_ads
    description: Google Ads data loaded by Fivetran
    database: "{{ env_var('DBT_DATABASE') }}"
    schema: fivetran_google_ads
    freshness:
      warn_after: {count: 25, period: hour}
      error_after: {count: 49, period: hour}
    loaded_at_field: _fivetran_synced
    tables:
      - name: ad_performance_report
        description: Daily performance metrics at campaign/ad group level
        columns:
          - name: campaign_id
            tests: [not_null]
          - name: date
            tests: [not_null]
          - name: cost_micros
            tests: [not_null]

  - name: meta_ads
    description: Meta (Facebook/Instagram) Ads data loaded by Fivetran
    database: "{{ env_var('DBT_DATABASE') }}"
    schema: fivetran_meta_ads
    freshness:
      warn_after: {count: 25, period: hour}
      error_after: {count: 49, period: hour}
    loaded_at_field: _fivetran_synced
    tables:
      - name: ad_insights
        description: Daily ad insights at campaign/adset level
        columns:
          - name: campaign_id
            tests: [not_null]
          - name: date_start
            tests: [not_null]
          - name: spend
            tests: [not_null]

  - name: linkedin_ads
    description: LinkedIn Ads data loaded by Fivetran
    database: "{{ env_var('DBT_DATABASE') }}"
    schema: fivetran_linkedin_ads
    freshness:
      warn_after: {count: 25, period: hour}
      error_after: {count: 49, period: hour}
    loaded_at_field: _fivetran_synced
    tables:
      - name: ad_analytics_by_campaign
        description: Daily performance by campaign
        columns:
          - name: campaign_id
            tests: [not_null]
          - name: day
            tests: [not_null]

  - name: hubspot
    description: HubSpot CRM data loaded by Fivetran
    database: "{{ env_var('DBT_DATABASE') }}"
    schema: fivetran_hubspot
    freshness:
      warn_after: {count: 25, period: hour}
      error_after: {count: 49, period: hour}
    loaded_at_field: _fivetran_synced
    tables:
      - name: contact
        description: HubSpot contacts with lifecycle and attribution fields
        columns:
          - name: contact_id
            tests: [not_null, unique]
          - name: email
            tests: [not_null, unique]
