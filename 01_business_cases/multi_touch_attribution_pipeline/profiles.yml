attribution_pipeline:
  target: dev
  outputs:
    dev:
      type: bigquery          # change to snowflake / redshift as needed
      method: oauth
      project: YOUR_GCP_PROJECT
      dataset: attribution_dev
      threads: 4
      timeout_seconds: 300

    prod:
      type: bigquery
      method: service-account
      project: YOUR_GCP_PROJECT
      dataset: attribution_prod
      keyfile: /path/to/service_account.json
      threads: 8
      timeout_seconds: 300

